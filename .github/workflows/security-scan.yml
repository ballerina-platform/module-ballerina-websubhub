name: Security Scan

on:
  push:
    branches: [security-scan-rollout]  # TEMP verify trigger
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

jobs:
  call_workflow:
    name: Run Security Scan Workflow
    if: ${{ github.repository_owner == 'ballerina-platform' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ballerina-platform/ballerina-library/.github/workflows/security-scan-template.yml@main
    secrets: inherit
    with:
      # examples/jms-websubhub needs IBM MQ JMS jars (fscontext.jar, providerutil.jar) that users supply
      # themselves and that are not on Maven, so that package cannot be compiled by bal scan in CI.
      # Scan the other example packages explicitly instead of the whole examples/ directory.
      scan-examples: false
      additional-scan-paths: "examples/in-memory-hub,examples/kafka-hub"

# ballerina/http:1 (resource with the `default` accessor) is a false positive here: this service is a
# reverse proxy that must forward every HTTP method of the hub API unchanged to the load-balanced hub
# instances, which then enforce the allowed methods themselves.
# TODO: replace this rule exclusion with a targeted scan suppression (with a reason) once `bal scan` supports it
# (planned for v0.13.0), and fix the false positives on the scan tool side: a secret-named identifier should only be
# reported when it is assigned a fixed value.
[rule]
exclude = ["ballerina/http:1"]
